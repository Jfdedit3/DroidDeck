name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Obtain pinned ARM64 PRoot and loader
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          SHA=5a2b7284e6357f88a14a790abd54e61effbe5f202c63b6aaba9b974c559649c3
          TAG=pack-proot-${SHA:0:16}
          curl --fail --location --retry 4 --retry-delay 3 --output /tmp/proot.tar.zst             "https://github.com/Droid-Deck/DroidDeck-Components/releases/download/$TAG/proot.tar.zst"
          echo "$SHA  /tmp/proot.tar.zst" | sha256sum -c -
          mkdir -p app/src/main/jniLibs/arm64-v8a
          tar --use-compress-program=unzstd -xf /tmp/proot.tar.zst -C app/src/main/jniLibs/arm64-v8a
          test -s app/src/main/jniLibs/arm64-v8a/libproot.so
          test -s app/src/main/jniLibs/arm64-v8a/libproot-loader.so
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DroidDeck-Lite-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
